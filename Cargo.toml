[package]
name = "liecharts"
version = "0.1.4"
authors = ["zzzdong <kuwater@163.com>"]
edition = "2024"
rust-version = "1.92"

description = "A Rust charting library with PNG and SVG rendering support"
documentation = "https://docs.rs/liecharts"
readme = "README.md"
homepage = "https://github.com/zzzdong/liecharts"
repository = "https://github.com/zzzdong/liecharts"
license = "Apache-2.0"
keywords = ["chart", "plot", "visualization", "svg", "png"]
categories = ["graphics", "visualization"]
exclude = ["site/", "examples/", "svg_output/", ".github/", "*.png", "*.svg"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
vello_cpu = "0.2"
parley = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2.0"
lievisual = "=0.2.0-beta.2"

[[bin]]
name = "liecharts-cli"
path = "src/bin/liecharts-cli.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["site"]
